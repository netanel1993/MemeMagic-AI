<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MemeMagic AI - The Smartest Meme Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Impact&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #f8fafc; }
        .meme-font { font-family: 'Impact', sans-serif; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #1e293b; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    </style>

    <script type="importmap">
    {
        "imports": {
            "react": "https://esm.sh/react@18.2.0",
            "react-dom": "https://esm.sh/react-dom@18.2.0/client",
            "@google/genai": "https://esm.sh/@google/genai@1.0.2"
        }
    }
    </script>
</head>
<body>
    <div id="root"></div>

    <script type="module">
        import React, { useState, useRef, useEffect, useCallback } from 'react';
        import ReactDOM from 'react-dom';
        import { GoogleGenAI } from '@google/genai';

        // --- Constants & Data ---
        const TRENDING_TEMPLATES = [
            { id: '1', name: 'Success', url: 'https://picsum.photos/id/10/800/600' },
            { id: '2', name: 'Vibe', url: 'https://picsum.photos/id/20/800/600' },
            { id: '3', name: 'Doge', url: 'https://picsum.photos/id/237/800/600' },
            { id: '4', name: 'Buttons', url: 'https://picsum.photos/id/40/800/600' },
            { id: '5', name: 'Guy', url: 'https://picsum.photos/id/64/800/600' },
            { id: '6', name: 'Handshake', url: 'https://picsum.photos/id/82/800/600' },
        ];

        // --- App Component ---
        const App = () => {
            const [apiKey, setApiKey] = useState(localStorage.getItem('gemini_key') || '');
            const [meme, setMeme] = useState({
                image: null, topText: '', bottomText: '', fontSize: 40, textColor: '#ffffff'
            });
            const [suggestions, setSuggestions] = useState([]);
            const [loading, setLoading] = useState({ captions: false, edit: false });
            const [editPrompt, setEditPrompt] = useState('');
            const canvasRef = useRef(null);
            const fileInputRef = useRef(null);

            // Save API Key
            useEffect(() => { localStorage.setItem('gemini_key', apiKey); }, [apiKey]);

            const drawMeme = useCallback(() => {
                const canvas = canvasRef.current;
                if (!canvas || !meme.image) return;
                const ctx = canvas.getContext('2d');
                const img = new Image();
                img.crossOrigin = "anonymous";
                img.src = meme.image;
                img.onload = () => {
                    canvas.width = img.width;
                    canvas.height = img.height;
                    ctx.drawImage(img, 0, 0);
                    ctx.fillStyle = meme.textColor;
                    ctx.strokeStyle = 'black';
                    ctx.lineWidth = Math.floor(canvas.width / 150);
                    ctx.textAlign = 'center';
                    const dynamicFontSize = (meme.fontSize / 100) * (canvas.width / 10);
                    ctx.font = `800 ${dynamicFontSize}px Impact, sans-serif`;
                    
                    ctx.textBaseline = 'top';
                    ctx.strokeText(meme.topText.toUpperCase(), canvas.width / 2, 20);
                    ctx.fillText(meme.topText.toUpperCase(), canvas.width / 2, 20);
                    
                    ctx.textBaseline = 'bottom';
                    ctx.strokeText(meme.bottomText.toUpperCase(), canvas.width / 2, canvas.height - 20);
                    ctx.fillText(meme.bottomText.toUpperCase(), canvas.width / 2, canvas.height - 20);
                };
            }, [meme]);

            useEffect(() => { drawMeme(); }, [drawMeme]);

            const handleFileUpload = (e) => {
                const file = e.target.files?.[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = (ev) => setMeme(p => ({ ...p, image: ev.target.result }));
                    reader.readAsDataURL(file);
                }
            };

            const handleMagicCaption = async () => {
                if (!apiKey) return alert("Please enter Gemini API Key");
                setLoading(p => ({...p, captions: true}));
                try {
                    const genAI = new GoogleGenAI(apiKey);
                    const model = genAI.getGenerativeModel({ model: "gemini-1.5-flash" });
                    const base64Data = meme.image.split(',')[1];
                    const result = await model.generateContent([
                        "Suggest 5 short, funny meme captions for this image. Return as a simple JSON array of strings.",
                        { inlineData: { data: base64Data, mimeType: "image/jpeg" } }
                    ]);
                    const text = result.response.text();
                    const cleanedText = text.replace(/```json|```/g, '');
                    setSuggestions(JSON.parse(cleanedText));
                } catch (err) { alert("AI Error: " + err.message); }
                finally { setLoading(p => ({...p, captions: false})); }
            };

            return (
                <div className="min-h-screen bg-slate-900 text-slate-100">
                    <header className="p-4 border-b border-slate-700 bg-slate-800/50 flex justify-between items-center">
                        <h1 className="text-xl font-bold text-indigo-400">MEMEMAGIC AI</h1>
                        <input 
                            type="password" 
                            placeholder="Enter Gemini API Key" 
                            className="bg-slate-900 border border-slate-600 rounded px-2 py-1 text-xs w-40"
                            value={apiKey}
                            onChange={(e) => setApiKey(e.target.value)}
                        />
                    </header>

                    <main className="max-w-6xl mx-auto p-4 grid lg:grid-cols-12 gap-8">
                        <div className="lg:col-span-4 space-y-6">
                            <div className="bg-slate-800 p-6 rounded-xl border border-slate-700">
                                <h2 className="font-bold mb-4">Editor</h2>
                                <input placeholder="Top Text" className="w-full mb-2 bg-slate-900 p-2 rounded" onChange={e => setMeme(p => ({...p, topText: e.target.value}))} />
                                <input placeholder="Bottom Text" className="w-full mb-4 bg-slate-900 p-2 rounded" onChange={e => setMeme(p => ({...p, bottomText: e.target.value}))} />
                                <div className="flex gap-4">
                                    <input type="range" className="flex-1" onChange={e => setMeme(p => ({...p, fontSize: e.target.value}))} />
                                    <input type="color" className="w-10" onChange={e => setMeme(p => ({...p, textColor: e.target.value}))} />
                                </div>
                            </div>

                            <div className="grid grid-cols-3 gap-2">
                                {TRENDING_TEMPLATES.map(t => (
                                    <img key={t.id} src={t.url} className="cursor-pointer rounded hover:ring-2 ring-indigo-500" onClick={() => setMeme(p => ({...p, image: t.url}))} />
                                ))}
                            </div>
                        </div>

                        <div className="lg:col-span-8 flex flex-col items-center">
                            <div className="bg-slate-800 p-4 rounded-2xl border border-slate-700 min-h-[400px] flex items-center justify-center w-full">
                                {meme.image ? <canvas ref={canvasRef} className="max-w-full rounded-lg shadow-xl" /> : <p className="text-slate-500 text-center">Upload or select an image to start</p>}
                            </div>
                            
                            {meme.image && (
                                <button 
                                    onClick={handleMagicCaption}
                                    disabled={loading.captions}
                                    className="mt-6 bg-indigo-600 hover:bg-indigo-700 px-8 py-3 rounded-full font-bold shadow-lg disabled:opacity-50"
                                >
                                    {loading.captions ? "AI is Thinking..." : "✨ MAGIC CAPTION"}
                                </button>
                            )}

                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-2 mt-6 w-full">
                                {suggestions.map((s, i) => (
                                    <button key={i} onClick={() => setMeme(p => ({...p, topText: s}))} className="bg-slate-800 p-3 rounded-lg text-left border border-slate-700 hover:border-indigo-500">
                                        "{s}"
                                    </button>
                                ))}
                            </div>
                        </div>
                    </main>
                    <input type="file" ref={fileInputRef} className="hidden" onChange={handleFileUpload} />
                </div>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
